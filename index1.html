<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌷 yêu dấu 🌷</title>

<!-- Comfortaa -->
<link https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:'Comfortaa',sans-serif;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#ffd6e7,#ffc2d1,#ffb3c6);
    }

    .card{
        background:rgba(255,255,255,0.8);
        backdrop-filter:blur(10px);
        padding:40px;
        border-radius:25px;
        text-align:center;
        width:90%;
        max-width:500px;
        box-shadow:0 8px 25px rgba(255,105,180,0.2);
    }

    h1{
        color:#ff5c8a;
        margin-bottom:20px;
        font-size:2rem;
    }

    #message{
        font-size:1.3rem;
        color:#555;
        min-height:80px;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:15px;
    }

    button{
        background:#ff7eb6;
        color:white;
        border:none;
        padding:14px 28px;
        border-radius:50px;
        font-size:1rem;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        transform:translateY(-3px);
        background:#ff5c9a;
    }

    .emoji{
        font-size:1.5rem;
    }
</style>
</head>
<body>

<div class="card">
    <h1>🌸我发自内心🌸</h1>

    <div id="message">
        点击这里，我会给你一些爱  ✨
    </div>

    <button onclick="randomMessage()">
        💖亲爱的
    </button>
</div>

<script>
const messages = [
    "🌷 情同手足!",
    "💖 成为你的朋友在很多方面都治愈了我.",
    "🌈 我永远在你身边.",
    "🐰 无论我们相隔多远，我的心都会永远想念你.",
    "✨ 任何言语都无法形容我们的友谊对我有多么重要.",
    "🦋 你值得拥有一个充满美好和真诚事物的世界.",
    "🌸 如果再给我一次机会，我仍然想做你的同桌.",
    "☁️ 保持均衡饮食.",
    "💐 亲如手足.",
    "🍓 无论我们认识一千天还是仅仅一个月，能成为你的朋友对我来说都是莫大的荣幸!"
];

let remainingMessages = [...messages];

function randomMessage() {

    // the end
if (remainingMessages.length === 0) {
    document.getElementById("message").innerHTML =
    "💌 感谢你走进我的生活.<br><br>" +
    "记住，如果你需要一个可以依靠的肩膀，我永远都在这里 🌸";

    createHearts();

    // Khởi động lại danh sách thông điệp
    remainingMessages = [...messages];

    return;
}
    const randomIndex = Math.floor(Math.random() * remainingMessages.length);

    document.getElementById("message").innerText =
        remainingMessages[randomIndex];

    remainingMessages.splice(randomIndex, 1);

    createHearts();
}</script>

</body>
</html>
